############################
##  Configuration
############################

## extended-keys required by pi
set -g extended-keys on
set -g extended-keys-format csi-u

## use 256 term for pretty colors
set -ga terminal-overrides ",*256col*:Tc"
set -g default-terminal "tmux-256color"

## use nushell for new windows/panes (matches login shell)
set -g default-shell "/run/current-system/sw/bin/nu"
set -g default-command "nu"

## increase scroll-back history
set -g history-limit 8000

## use vim key bindings
setw -g mode-keys vi

## copy to system clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
set -g set-clipboard on

## Allow applications (nvim, opencode) to send OSC 52 clipboard sequences
set -g allow-passthrough on

## decrease command delay (increases vim responsiveness)
set -sg escape-time 1

## increase repeat time for repeatable commands
set -g repeat-time 1000

## start window index at 1
set -g base-index 1

## start pane index at 1
setw -g pane-base-index 1

##disable auto rename
set-option -g allow-rename off

## re-number windows when one is closed
set -g renumber-windows on

##  Key Bindings
############################

## tmux prefix
unbind C-b
set -g prefix C-a
set -g mouse on

## Toggle mouse on/off with prefix + m
bind m if -F '#{mouse}' 'set -g mouse off; display-message "Mouse: OFF (native copy)"' 'set -g mouse on; display-message "Mouse: ON"'

## window splitting
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind Ç split-window -h -c '#{pane_current_path}'  # ES layout: Shift + ç key (same physical key as |)
bind \\ split-window -h -c '#{pane_current_path}'
bind ç split-window -h -c '#{pane_current_path}'  # ES layout: ç key (same physical key as \)

unbind '"'
bind - split-window -v -c '#{pane_current_path}'
bind "'" split-window -v -c '#{pane_current_path}'  # ES layout: same physical key as -

## Layout-independent alias for copy-mode. The natural `[` key doesn't work
## on ES layout because the ES physical key for `[` produces `` ` `` (a
## dead-grave accent). Use `prefix + e` instead, which is identical on both
## layouts and opens copy-mode for scrolling/selecting with vim-like keys.
bind e copy-mode

bind = select-layout even-horizontal
bind _ select-layout -E

bind Space if-shell -F "#{?@window_maximized,1,0}" \
    "set -uw @window_maximized; select-layout -E" \
    "set -w @window_maximized 1; resize-pane -y 999"

bind-key -r j select-pane -D \; set -w @window_maximized 1 \; resize-pane -y 999
bind-key -r k select-pane -U \; set -w @window_maximized 1 \; resize-pane -y 999


bind c new-window -c '#{pane_current_path}'
bind M-c new-session

bind-key \} swap-window -t +1\; select-window -t +1
bind-key \{ swap-window -t -1\; select-window -t -1

bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5

## swap panes with arrow keys (instead of selecting)
unbind -T prefix Up
unbind -T prefix Down
unbind -T prefix Left
unbind -T prefix Right
bind-key Right select-pane -R \; swap-pane -s '!' \; select-pane -R
bind-key Left select-pane -L \; swap-pane -s '!' \; select-pane -L
bind-key Up select-pane -U \; swap-pane -s '!' \; select-pane -U
bind-key Down select-pane -D \; swap-pane -s '!' \; select-pane -D

bind-key u switch-client -p
bind-key i switch-client -n

bind C-a last-window

## force a reload of the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

## Status update interval
set -g status-interval 1

## Clock mode
set -g clock-mode-colour colour24
set -g clock-mode-style 24

# Will go next session on killing a session
set-option -g detach-on-destroy off

## Plugins
##################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#latest'
set -g @plugin 'laktak/extrakto'
# tmux.expose (Mission Control-style session switcher)
set -g @tmux-expose-key 'q'
set -g @tmux-expose-key-table 'prefix'
set -g @plugin 'cesarferreira/tmux.expose'

# Flash-copy (vim-flash style copy). The plugin itself is fetched from GitHub
# and stored in the Nix store by home/scripts/flash-copy.nix, so we don't
# load it via TPM. Both `prefix + y` (default word mode) and `prefix + Y`
# (range mode) dispatches to wrappers in the store.
#   y → word mode (default)
#   Y → range mode (pre-activated; the wrapper pre-selects the first
#       endpoint on the first label press and completes the range on the
#       second)
bind-key y run-shell "flash-copy --pane-id #{pane_id} --client-name #{client_name}"
bind-key Y run-shell "flash-copy-range --pane-id #{pane_id} --client-name #{client_name}"

set-option -g status-position top
set -g status-style bg=default

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_pane_status_enabled "no"
set -g @catppuccin_pane_default_fill "none"

set -g @catppuccin_window_flags_icon_last " 🏷"
set -g @catppuccin_window_flags_icon_current " 👀"
set -g @catppuccin_window_flags_icon_zoom " 🔎"
set -g @catppuccin_window_flags_icon_mark " 🔺"
set -g @catppuccin_window_flags_icon_silent " 🔇"
set -g @catppuccin_window_flags_icon_activity " 🛎"
set -g @catppuccin_window_flags_icon_bell " 🛎"

set -g @catppuccin_window_text " #{window_name}" 
set -g @catppuccin_window_current_text " #{window_name}" 

set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_pink}"

set -g @catppuccin_pane_default_text "#{window_name}"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""

set -g status-right ""
set -agF status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #[default]#[bg=#{@thm_bg}]##(tmux ls -F '####{?session_attached,#[fg=#{@thm_bg} bg=#{@thm_blue} bold] ####S #[default],#[fg=#{@thm_overlay_0} bg=#{@thm_bg}] ####S #[default]}' | tr '\\n' ' ') "
set -agF status-right "#[bg=#{@thm_bg},fg=#{@thm_green}] /##H/ "
set -agF status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] %H:%M "


# Resurrect keys
set -g @resurrect-save 'W'
set -g @resurrect-restore 'R'

# Tmux FZF
unbind f
TMUX_FZF_LAUNCH_KEY="C-s"
bind-key s run-shell -b "/home/eleloi/.config/tmux/plugins/tmux-fzf/scripts/session.sh"
bind-key P run-shell -b "/home/eleloi/.config/tmux/plugins/tmux-fzf/scripts/clipboard.sh"

# sesh
unbind t
bind-key "t" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' sh -c 'result=$(sesh list -c -t -z -d | fzf --height 100% --reverse --header="Sessions" --prompt="Sesh> ") && [ -n "$result" ] && sesh connect "$result"'

# switch-font
bind-key "f" display-popup -E -w 40% -h 40% -T 'Switch Font' switch-font

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'

## Override catppuccin pane borders (applied AFTER theme loads)
set -g pane-border-lines simple
set -g pane-active-border-style "fg=#f9e2af bg=default"
set -g pane-border-style "fg=#585b70 bg=default"

## Pane titles
## prefix + . renames the current pane. The name is stored in the per-pane
## user option @pane_name, so applications that set the terminal title
## themselves (nu sets it to the cwd, editors to the file name) cannot
## overwrite it. Without a manual name nothing is shown in the border.
##
## The title lives on the pane border status line, which costs one row of
## vertical space. pane-border-status is a window option, so the row is only
## reserved in windows that contain at least one titled pane; the helper
## tmux-pane-border-sync (from the nix config) keeps it in sync.
set -gw pane-border-status off
set -gw pane-border-format "#{?@pane_name, #[fg=#f9e2af]#{@pane_name}#[default],}"

bind-key . command-prompt -p "Pane title" "set -p @pane_name '%1'; run-shell -b 'tmux-pane-border-sync #{window_id}'"
## prefix + b removes the manual name (prefix + , keeps the default rename-window)
bind-key b set-option -pu @pane_name \; run-shell -b 'tmux-pane-border-sync #{window_id}'
## keep the border row in sync when a titled pane is closed
set-hook -g after-kill-pane 'run-shell -b "tmux-pane-border-sync #{window_id}"'
